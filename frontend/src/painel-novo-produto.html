<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - F&F Imports</title>
    <link rel="stylesheet" href="style-novo-produto.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="icon-box-admin">
                    <span class="grid-icon">⊞</span>
                </div>
                <div class="header-text">
                    <h3 id="admin-nome">Admin</h3>
                    <p>Gerenciar produtos</p>
                </div>
            </div>

            <nav class="menu">
                <div class="menu-item active" id="menu-produtos">
                    <span class="icon">📦</span> Produtos
                </div>
                <div class="menu-item" id="menu-adicionar">
                    <span class="icon">＋</span> Adicionar
                </div>
                <a class="menu-item menu-link-site" href="catalogo.html">
                    <span class="icon">🌐</span> Ver Loja
                </a>
                <div class="menu-item menu-logout" id="menu-sair">
                    <span class="icon">↪</span> Sair
                </div>
            </nav>
        </aside>

        <main class="content">
            <p id="admin-feedback" class="admin-feedback" role="status" aria-live="polite" hidden></p>
            
            <section id="view-list">
                <header class="content-title">
                    <h1>Produtos</h1>
                    <p id="status-text">Carregando produtos...</p>
                </header>
                <div id="products-container" class="products-list">
                    
                </div>
            </section>

            <section id="view-form" class="hidden">
                <header class="content-title">
                    <h1 id="form-titulo">Novo Produto</h1>
                    <p id="form-subtitulo">Preencha as informações e adicione a imagem do item</p>
                </header>

                <form id="cadastro-form" class="cadastro-form">
                    <div class="form-group">
                        <label>Imagem Principal do Produto (JPG, PNG ou WEBP até 5MB)</label>
                        <label for="input-foto" class="image-upload-box" id="area-upload">
                            <img id="preview-img" src="" alt="Prévia">
                            
                            <div class="upload-content" id="upload-content">
                                <span class="upload-icon">🖼️</span>
                                <p id="texto-upload">Clique para selecionar uma foto</p>
                            </div>
                            
                            <input type="file" id="input-foto" accept="image/jpeg,image/png,image/webp" hidden>
                        </label>
                    </div>

                    <div class="form-group">
                        <label for="nome-prod">Nome do Produto *</label>
                        <input type="text" id="nome-prod" placeholder="Ex: iPhone 15 Plus 128GB" maxlength="150" >
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoria-prod">Categoria *</label>
                            <select id="categoria-prod" >
                                <option value="">Carregando categorias...</option>
                                <option value="Consoles">Consoles</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="marca-prod">Marca *</label>
                            <select id="marca-prod" >
                                <option value="">Carregando marcas...</option>
                                <option value="microsoft">Microsoft</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="preco-prod">Preço (R$) *</label>
                            <input type="text" id="preco-prod" placeholder="0,00" >
                        </div>

                        <div class="form-group">
                            <label for="disponivel-prod">Disponibilidade</label>
                            <select id="disponivel-prod">
                                <option value="true" selected>Disponível</option>
                                <option value="false">Indisponível</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="espec-prod">Especificações Técnicas (separadas por vírgula)</label>
                        <input type="text" id="espec-prod" placeholder="Ex: 128GB, 6GB RAM, Câmera dupla 48MP, Tela 6.1">
                    </div>

                    <div class="form-group">
                        <label for="desc-prod">Descrição</label>
                        <textarea id="desc-prod" placeholder="Descreva o produto em detalhes..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit" id="save-product">Cadastrar produto</button>
                        <button type="button" class="btn-cancel hidden" id="cancel-edit">Cancelar</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="script-novo-produto.js"></script>
</body>
</html>

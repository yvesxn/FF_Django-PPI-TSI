    <!-- JAVASCRIPT DO MENU MOBILE -->
    <script>

        const botaoMenu = document.getElementById("btn-mobile");
        const menuLinks = document.getElementById("menu-links");

        function fecharMenu() {

            menuLinks.classList.remove("aberto");

            botaoMenu.setAttribute("aria-expanded", "false");
            botaoMenu.setAttribute("aria-label", "Abrir menu");

        }

        botaoMenu.addEventListener("click", () => {

            const menuAberto = menuLinks.classList.toggle("aberto");

            botaoMenu.setAttribute("aria-expanded", String(menuAberto));

            botaoMenu.setAttribute(
                "aria-label",
                menuAberto ? "Fechar menu" : "Abrir menu"
            );

        });

        menuLinks.addEventListener("click", (evento) => {

            if (evento.target.closest("a")) {
                fecharMenu();
            }

        });

        document.addEventListener("keydown", (evento) => {

            if (
                evento.key === "Escape" &&
                menuLinks.classList.contains("aberto")
            ) {

                fecharMenu();
                botaoMenu.focus();

            }

        });

    </script>
